# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nfconsumerdb
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Configuración de JPA/Hibernate /// Validate == No modifica el schema (Usar flyway)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Base path para el api rest
spring.mvc.servlet.path=/api/v1

# Configuración para el manejo de errores
#server.error.whitelabel.enabled=false
#server.error.path=/error


# Security temporal
spring.security.enabled=true
